[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "bdt_mobility"
version = "1.0.0"
description = "Bologna Digital Twin mobility toolkit: data extraction and policy-impact simulation for a Zone of Interest"
requires-python = ">=3.12,<3.13"
dependencies = [
    "civic-digital-twins>=0.12.0,<0.13",
    "contextily>=1.7.0",
    "dash>=3.3.0",
    "digitalhub>=0.15.3",
    "digitalhub-runtime-python>=0.15.2",
    "dsf-suite>=6.0.3",
    "fast-traffic-simulator>=0.2,<0.3",
    "fastexcel>=0.19.0",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "h3>=4.4.2",
    "holidays>=0.87",
    "lxml>=6.0.2",
    "neatnet>=0.1.5",
    "notebook>=7.5.0",
    "openpyxl>=3.1.5",
    "osmnx>=2.0.7",
    "pandas>=2.2.2,<3.0.0",
    "pdfplumber>=0.11.9",
    "plotly>=6.5.0",
    "polars>=1.35.2",
    "seaborn>=0.13.2",
    "streamlit>=1.51.0",
    "uxsim>=1.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests, no data required",
    "simulation: simulation regression tests — require real data",
    "integration: end-to-end tests against real data files",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
